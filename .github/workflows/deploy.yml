# Visit https://docusaurus.io/docs/deployment for more information
# For more information about GitHub Actions, see https://docs.github.com/en/actions

name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main # This should be the name of your default branch

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Retrieve Git history to generate last updated time in Docusaurus
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          # The following options are used for the website hosted on GitHub Pages,
          # and should be consistent with the baseUrl in docusaurus.config.js
          external_repository: 'NabiaHaider/Hackathon_Physical_AI_Humanoid_Robotics_Book'
          publish_branch: 'gh-pages'
